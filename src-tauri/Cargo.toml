[package]
name = "flow-canvas"
version = "0.1.0"
description = "A local project flow canvas"
authors = ["Flow Canvas"]
edition = "2021"

[lib]
name = "flow_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
open = "5.3"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
